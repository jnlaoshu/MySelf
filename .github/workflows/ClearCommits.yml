# =============================================================================
# 工作流名称：清理提交历史与工作流运行记录
# 功能说明：
#   1. 强制重写 Git 历史，将分支重置为单次提交（内容不变，历史清零）
#   2. 删除所有历史工作流运行日志，释放存储空间
# 警告：此操作会永久丢失历史提交记录，仅适合个人维护的仓库，
#       请勿在多人协作仓库中启用定时触发。
# =============================================================================

name: Clear Commits

# -----------------------------------------------------------------------------
# 触发条件
# -----------------------------------------------------------------------------
on:
  # 默认仅支持手动触发（避免误操作）
  workflow_dispatch:
  # 如需定时清理，可取消下面注释并调整 Cron 表达式
  # schedule:
  #   - cron: '30 23 1 * *'   # 每月 1 日 23:30 UTC

# -----------------------------------------------------------------------------
# 权限设置（关键！确保 GITHUB_TOKEN 有写入权限）
# -----------------------------------------------------------------------------
permissions:
  contents: write   # 允许强制推送和修改仓库内容

# -----------------------------------------------------------------------------
# 任务定义
# -----------------------------------------------------------------------------
jobs:
  build:
    runs-on: windows-latest   # 使用 Windows 环境以兼容某些清理工具

    steps:
      # 检出仓库（指定默认分支，请根据实际情况修改 ref）
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          ref: main   # 请将 main 替换为您的默认分支名称（如 master）

      # 强制重置 Git 历史
      - name: Rewrite Git History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 创建一个孤立分支（无历史）
          git checkout --orphan clearhistory
          # 删除旧分支（请将 main 替换为您的默认分支名）
          git branch -D main
          # 重新创建主分支（孤儿分支）
          git checkout --orphan main
          # 添加所有当前文件
          git add .
          # 创建一个初始提交（内容不变，历史清零）
          git commit -m "ㅤ"
          # 强制推送到远程（覆盖远程历史）
          git push -f -u origin main

      # 删除所有历史工作流运行记录（释放 GitHub 存储空间）
      - name: Cleanup Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0          # 保留天数（0 表示不保留任何历史）
          keep_minimum_runs: 0    # 最少保留运行次数（0 表示全部删除）