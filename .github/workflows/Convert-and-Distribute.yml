# =============================================================================
# 工作流：规则转换与多平台分发
# 更新：2026.08.15 22:55
#
# 功能：
#   - 读取本仓库 Egern/Rule 下的规则文件
#   - 转换为各平台兼容格式，并分发到对应目录
#   - 支持的平台：Surge、Stash、Loon、Mihomo、Shadowrocket、QuantumultX
#   - Surge 除 AdBlock/AIGC/Telegram 三个整合源外，直接同步 blackmatrix7 原生列表
#   - 清理、去重、排序、校验规则
#   - 仅在内容变化时提交，避免空提交
# =============================================================================
name: Convert and Distribute

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"

concurrency:
  group: convert-and-distribute-rules
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  Convert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Convert and Distribute Rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, tempfile
          from pathlib import Path
          import yaml
          from datetime import datetime, timezone, timedelta
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          SOURCE_DIR = Path("Egern/Rule")

          TARGET_CONFIG = {
              "Surge": {"dir": "Surge/Rule", "ext": ".list"},
              "Stash": {"dir": "Stash/Rule", "ext": ".yaml"},
              "Loon": {"dir": "Loon/Rule", "ext": ".list"},
              "Mihomo": {"dir": "Mihomo/Rule", "ext": ".yaml"},
              "Shadowrocket": {"dir": "Shadowrocket/Rule", "ext": ".list"},
              "QuantumultX": {"dir": "QuantumultX/Rule", "ext": ".list"},
          }

          SOURCE_MAP = {
              "AdBlock": "AdGuard DNS Filter, AdRules, AWAvenue",
              "Lan": "blackmatrix7, Repcz",
              "AIGC": "blackmatrix7, ConnersHua, Repcz",
              "Telegram": "blackmatrix7, SukkaW",
          }
          DEFAULT_SOURCE = "blackmatrix7/ios_rule_script"

          # Surge 非整合源直接从 blackmatrix7 下载
          SURGE_DIRECT_SKIP = {"AdBlock", "AIGC", "Telegram"}

          PLATFORM_PREFIX_MAP = {
              "Surge": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "DOMAIN-SUFFIX",
                  "domain_keyword_set": "DOMAIN-KEYWORD",
                  "domain_wildcard_set": "DOMAIN-WILDCARD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "url_regex_set": "URL-REGEX",
                  "user_agent_set": "USER-AGENT",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
                  "process_name_set": "PROCESS-NAME",
                  "and_set": "AND",
                  "or_set": "OR",
                  "not_set": "NOT",
              },
              "Stash": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "DOMAIN-SUFFIX",
                  "domain_keyword_set": "DOMAIN-KEYWORD",
                  "domain_wildcard_set": "DOMAIN-WILDCARD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
              },
              "Loon": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "DOMAIN-SUFFIX",
                  "domain_keyword_set": "DOMAIN-KEYWORD",
                  "domain_wildcard_set": "DOMAIN-WILDCARD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "url_regex_set": "URL-REGEX",
                  "user_agent_set": "USER-AGENT",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
              },
              "Mihomo": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "DOMAIN-SUFFIX",
                  "domain_keyword_set": "DOMAIN-KEYWORD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
              },
              "Shadowrocket": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "DOMAIN-SUFFIX",
                  "domain_keyword_set": "DOMAIN-KEYWORD",
                  "domain_wildcard_set": "DOMAIN-WILDCARD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "url_regex_set": "URL-REGEX",
                  "user_agent_set": "USER-AGENT",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
              },
              "QuantumultX": {
                  "domain_set": "DOMAIN",
                  "domain_suffix_set": "SUFFIX",
                  "domain_keyword_set": "KEYWORD",
                  "domain_wildcard_set": "WILDCARD",
                  "ip_cidr_set": "IP-CIDR",
                  "ip_cidr6_set": "IP-CIDR6",
                  "asn_set": "IP-ASN",
                  "url_regex_set": "URL-REGEX",
                  "user_agent_set": "USER-AGENT",
                  "dest_port_set": "DEST-PORT",
                  "geoip_set": "GEOIP",
              },
          }

          PLATFORM_UNSUPPORTED = {
              "Surge": set(),
              "Stash": {"URL-REGEX", "USER-AGENT", "AND", "OR", "NOT", "PROCESS-NAME"},
              "Loon": {"PROCESS-NAME", "AND", "OR", "NOT"},
              "Mihomo": {"URL-REGEX", "USER-AGENT", "PROCESS-NAME", "DOMAIN-WILDCARD", "AND", "OR", "NOT"},
              "Shadowrocket": {"PROCESS-NAME", "AND", "OR", "NOT"},
              "QuantumultX": {"PROCESS-NAME", "AND", "OR", "NOT"},
          }

          IP_TYPES = {"IP-CIDR", "IP-CIDR6", "IP-ASN", "GEOIP"}

          def create_session():
              session = requests.Session()
              retry = Retry(total=3, connect=3, read=3, backoff_factor=1,
                            status_forcelist=(429, 500, 502, 503, 504))
              adapter = HTTPAdapter(max_retries=retry, pool_connections=10, pool_maxsize=10)
              session.mount("https://", adapter)
              session.mount("http://", adapter)
              session.headers.update({"User-Agent": "Egern-Rule-Distributor/2.0"})
              return session

          SESSION = create_session()

          def clean_rule_line(line):
              line = line.strip()
              if not line:
                  return None
              if line.startswith(("#", "//", ";", "!")):
                  return None
              if line.startswith("- "):
                  line = line[2:].strip()
              if len(line) >= 2 and line[0] == line[-1] and line[0] in ("'", '"'):
                  line = line[1:-1].strip()
              line = re.sub(r"\s+#.*$", "", line).strip()
              return line if line else None

          def parse_egern_rule_file(file_path):
              try:
                  with open(file_path, "r", encoding="utf-8-sig") as f:
                      data = yaml.safe_load(f)
              except Exception as e:
                  print(f"  Warning: Failed to parse {file_path.name}: {e}")
                  return {}, False

              if not isinstance(data, dict):
                  return {}, False

              no_resolve = data.get("no_resolve", False)

              result = {}
              for key, values in data.items():
                  if key in ("no_resolve", "payload") or not isinstance(values, list):
                      continue
                  cleaned = []
                  for item in values:
                      if isinstance(item, str):
                          cleaned.append(item.strip())
                  if cleaned:
                      result[key] = sorted(set(cleaned))
              return result, no_resolve

          def convert_to_platform_format(rule_data, platform, no_resolve=False):
              prefix_map = PLATFORM_PREFIX_MAP.get(platform, {})
              unsupported = PLATFORM_UNSUPPORTED.get(platform, set())
              rules = []
              for egern_type, values in rule_data.items():
                  target_prefix = prefix_map.get(egern_type)
                  if target_prefix is None:
                      continue
                  if egern_type in unsupported or target_prefix in unsupported:
                      continue
                  for value in values:
                      if platform == "Mihomo" and egern_type == "domain_wildcard_set":
                          if value.startswith("*."):
                              value = value[2:]
                              rules.append(f"DOMAIN-SUFFIX,{value}")
                          continue
                      rule = f"{target_prefix},{value}"
                      # classical 平台自动附加 no-resolve 到 IP 规则
                      if (no_resolve and TARGET_CONFIG[platform]["ext"] == ".list"
                              and target_prefix in IP_TYPES
                              and "no-resolve" not in rule.lower()):
                          rule += ",no-resolve"
                      rules.append(rule)
              return rules

          def write_rules_file(output_path, rules, rule_name, source, no_resolve, is_yaml):
              if not rules:
                  print(f"  Warning: No rules generated for {output_path}")
                  return

              unique_rules = {}
              for rule in rules:
                  unique_rules[rule.lower()] = rule
              sorted_rules = sorted(unique_rules.values())

              output_path.parent.mkdir(parents=True, exist_ok=True)

              bj_time = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
              update_time = bj_time.strftime("%Y-%m-%d %H:%M:%S")
              reference_url = f"https://raw.githubusercontent.com/jnlaoshu/MySelf/main/{output_path.as_posix()}"

              fd, temp_path = tempfile.mkstemp(prefix=f".{output_path.stem}.", suffix=".tmp", dir=output_path.parent, text=True)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(f"# 规则名称: {rule_name}\n")
                      f.write(f"# 规则统计: {len(sorted_rules)}\n")
                      f.write(f"# 规则来源: {source}\n")
                      f.write(f"# 引用链接: {reference_url}\n")
                      f.write(f"# 更新时间: {update_time}\n")
                      f.write("\n")
                      if is_yaml and no_resolve:
                          f.write("no_resolve: true\n")
                      for rule in sorted_rules:
                          f.write(f"{rule}\n")
                  os.replace(temp_path, output_path)
              except Exception:
                  try:
                      os.unlink(temp_path)
                  except OSError:
                      pass
                  raise

          def download_surge_direct(rule_name, output_path):
              """从 blackmatrix7 直接下载 Surge 原生列表"""
              url = f"https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/{rule_name}/{rule_name}.list"
              print(f"  Downloading Surge direct: {url}")
              response = SESSION.get(url, timeout=30)
              response.raise_for_status()
              raw_lines = response.text.splitlines()

              rules = []
              for line in raw_lines:
                  cleaned = clean_rule_line(line)
                  if cleaned:
                      rules.append(cleaned)

              unique_rules = {}
              for rule in rules:
                  unique_rules[rule.lower()] = rule
              sorted_rules = sorted(unique_rules.values())

              if not sorted_rules:
                  raise ValueError("Downloaded Surge list is empty")

              output_path.parent.mkdir(parents=True, exist_ok=True)
              bj_time = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
              update_time = bj_time.strftime("%Y-%m-%d %H:%M:%S")
              reference_url = f"https://raw.githubusercontent.com/jnlaoshu/MySelf/main/{output_path.as_posix()}"

              fd, temp_path = tempfile.mkstemp(prefix=f".{output_path.stem}.", suffix=".tmp", dir=output_path.parent, text=True)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(f"# 规则名称: {rule_name}\n")
                      f.write(f"# 规则统计: {len(sorted_rules)}\n")
                      f.write(f"# 规则来源: {DEFAULT_SOURCE}\n")
                      f.write(f"# 引用链接: {reference_url}\n")
                      f.write(f"# 更新时间: {update_time}\n")
                      f.write("\n")
                      for rule in sorted_rules:
                          f.write(f"{rule}\n")
                  os.replace(temp_path, output_path)
              except Exception:
                  try:
                      os.unlink(temp_path)
                  except OSError:
                      pass
                  raise

          print("=" * 72)
          print("Rule Conversion and Distribution")
          print("=" * 72)

          for config in TARGET_CONFIG.values():
              Path(config["dir"]).mkdir(parents=True, exist_ok=True)

          source_files = sorted(SOURCE_DIR.glob("*.yaml"))
          if not source_files:
              print("No rule files found in Egern/Rule/")
              exit(0)

          for source_file in source_files:
              rule_name = source_file.stem
              print(f"\nProcessing: {rule_name}")

              rule_data, no_resolve = parse_egern_rule_file(source_file)
              if not rule_data:
                  print(f"  Skipping {rule_name}: No valid rule data")
                  continue

              source = SOURCE_MAP.get(rule_name, DEFAULT_SOURCE)

              for platform, config in TARGET_CONFIG.items():
                  ext = config["ext"]
                  output_path = Path(config["dir"]) / f"{rule_name}{ext}"

                  if platform == "Surge" and rule_name not in SURGE_DIRECT_SKIP:
                      # Surge 非整合源直接下载
                      try:
                          download_surge_direct(rule_name, output_path)
                          print(f"  -> Surge: direct download -> {output_path}")
                      except Exception as e:
                          print(f"  -> Surge direct download failed ({e}), falling back to conversion")
                          rules = convert_to_platform_format(rule_data, platform, no_resolve)
                          is_yaml = ext == ".yaml"
                          write_rules_file(output_path, rules, rule_name, source, no_resolve, is_yaml)
                          print(f"  -> Surge: {len(rules)} rules converted -> {output_path}")
                  else:
                      rules = convert_to_platform_format(rule_data, platform, no_resolve)
                      if not rules:
                          print(f"  -> {platform}: No rules generated (unsupported types)")
                          continue
                      is_yaml = ext == ".yaml"
                      write_rules_file(output_path, rules, rule_name, source, no_resolve, is_yaml)
                      print(f"  -> {platform}: {len(rules)} rules -> {output_path}")

          print("\n" + "=" * 72)
          print("Conversion completed successfully.")
          print("=" * 72)
          PY

      - name: Normalize Platform Rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, tempfile
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          PLATFORM_CONFIG = {
              "Surge": {"dir": "Surge/Rule", "ext": ".list"},
              "Stash": {"dir": "Stash/Rule", "ext": ".yaml"},
              "Loon": {"dir": "Loon/Rule", "ext": ".list"},
              "Mihomo": {"dir": "Mihomo/Rule", "ext": ".yaml"},
              "Shadowrocket": {"dir": "Shadowrocket/Rule", "ext": ".list"},
              "QuantumultX": {"dir": "QuantumultX/Rule", "ext": ".list"},
          }

          EXTRA_REMOVE = {
              "Stash": ["USER-AGENT", "URL-REGEX", "AND", "OR", "NOT", "PROCESS-NAME"],
              "Loon": ["PROCESS-NAME", "AND", "OR", "NOT"],
              "Mihomo": ["USER-AGENT", "URL-REGEX", "PROCESS-NAME", "AND", "OR", "NOT"],
              "Shadowrocket": ["PROCESS-NAME", "AND", "OR", "NOT"],
              "QuantumultX": ["PROCESS-NAME", "AND", "OR", "NOT"],
          }

          SOURCE_MAP = {
              "AdBlock": "AdGuard DNS Filter, AdRules, AWAvenue",
              "Lan": "blackmatrix7, Repcz",
              "AIGC": "blackmatrix7, ConnersHua, Repcz",
              "Telegram": "blackmatrix7, SukkaW",
          }
          DEFAULT_SOURCE = "blackmatrix7/ios_rule_script"

          def parse_no_resolve(file_path):
              try:
                  with open(file_path, "r", encoding="utf-8") as f:
                      for line in f:
                          if line.startswith("no_resolve:"):
                              return True
                          if len(line) > 100:
                              break
              except Exception:
                  pass
              return False

          for platform, config in PLATFORM_CONFIG.items():
              rule_dir = Path(config["dir"])
              if not rule_dir.exists():
                  continue
              ext = config["ext"]

              remove_patterns = EXTRA_REMOVE.get(platform, [])
              remove_prefixes = tuple(f"{p}," for p in remove_patterns)

              for file_path in sorted(rule_dir.glob(f"*{ext}")):
                  print(f"Normalizing {platform}/{file_path.name}...")

                  with open(file_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

                  normalized = []
                  for line in lines:
                      stripped = line.strip()
                      if not stripped:
                          continue
                      if stripped.startswith(("#", "//", ";")):
                          continue
                      if remove_prefixes and stripped.upper().startswith(remove_prefixes):
                          continue
                      if platform == "Mihomo" and stripped.upper().startswith("DOMAIN-WILDCARD,"):
                          parts = stripped.split(",", 1)
                          if len(parts) == 2 and parts[1].strip().startswith("*."):
                              domain = parts[1].strip()[2:]
                              normalized.append(f"DOMAIN-SUFFIX,{domain}")
                          continue
                      normalized.append(stripped)

                  unique = {}
                  for rule in normalized:
                      unique[rule.lower()] = rule
                  sorted_rules = sorted(unique.values())

                  if sorted_rules:
                      rule_name = file_path.stem
                      source = SOURCE_MAP.get(rule_name, DEFAULT_SOURCE)
                      reference_url = f"https://raw.githubusercontent.com/jnlaoshu/MySelf/main/{file_path.as_posix()}"
                      no_resolve = parse_no_resolve(file_path)

                      old_update_time = None
                      for line in lines:
                          if line.startswith("# 更新时间:"):
                              old_update_time = line.split(":", 1)[1].strip()
                              break

                      if old_update_time:
                          update_time = old_update_time
                      else:
                          bj_time = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
                          update_time = bj_time.strftime("%Y-%m-%d %H:%M:%S")

                      header_lines = [
                          f"# 规则名称: {rule_name}\n",
                          f"# 规则统计: {len(sorted_rules)}\n",
                          f"# 规则来源: {source}\n",
                          f"# 引用链接: {reference_url}\n",
                          f"# 更新时间: {update_time}\n",
                          "\n",
                      ]
                      if no_resolve:
                          header_lines.append(f"no_resolve: true\n")

                      fd, temp_path = tempfile.mkstemp(prefix=f".{file_path.stem}.", suffix=".tmp", dir=file_path.parent, text=True)
                      try:
                          with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                              for h in header_lines:
                                  f.write(h)
                              for rule in sorted_rules:
                                  f.write(f"{rule}\n")
                          os.replace(temp_path, file_path)
                      except Exception:
                          try:
                              os.unlink(temp_path)
                          except OSError:
                              pass
                          raise

                      print(f"  Updated: {len(sorted_rules)} rules")
                  else:
                      print(f"  Warning: No valid rules remaining")

          print("\nNormalization completed.")
          PY

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          for dir in Surge/Rule Stash/Rule Loon/Rule Mihomo/Rule Shadowrocket/Rule QuantumultX/Rule; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              git add "$dir/"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Changes detected:"
          git diff --staged --stat
          git commit -m "convert(rules): $(date '+%Y-%m-%d %H:%M:%S')"
          git push