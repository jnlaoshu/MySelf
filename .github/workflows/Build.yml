# =============================================================================
# 工作流名称：规则自动构建
# 文件位置：.github/workflows/Build.yml
# 更新时间：2026.08.14 08:48
#
# 核心功能：
#   1. 三源合并生成 AdBlock.yaml (AdGuard DNS Filter + AdRules + AWAvenue)
#   2. 自动诊断：单源数量、独占、交集、顺序贡献、最终合并数量
#   3. 自动同步 Egern/Rule 现有规则对应的 blackmatrix7 Surge 规则
#   4. Lan / AIGC 使用独立多源解析器，禁止裸拼接不同格式文件
#   5. 所有规则统一转换为 Egern 分组 YAML (符合官方字段名)
#   6. 清理、去重、排序、YAML 结构校验、规则类型校验
#   7. 使用 git show HEAD 获取旧版本稳定判断 payload 变化
#   8. 更新时间逻辑：新文件/变化→当前时间，未变→保留旧时间
#   9. 只有真实内容变化才提交 Git
#  10. 任一核心数据源异常时构建失败，保留原文件，禁止残缺覆盖
# =============================================================================
name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: build-egern-rules
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml urllib3

      # =====================================================================
      # Step 4: Build AdBlock.yaml (output as 'domain' list)
      # =====================================================================
      - name: Build AdBlock.yaml
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ipaddress, os, re, tempfile
          from collections import OrderedDict
          from datetime import datetime, timezone
          import requests, yaml
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUTPUT_FILE = "Egern/Rule/AdBlock.yaml"
          REQUEST_TIMEOUT = 30
          USER_AGENT = "Egern-AdBlock-Builder/2.0"
          FINAL_MIN_DOMAINS = 100000

          SOURCES = OrderedDict({
              "AdGuard_DNS": {
                  "url": "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt",
                  "parser": "adguard",
                  "minimum": 100000,
              },
              "AdRules": {
                  "url": "https://raw.githubusercontent.com/Cats-Team/AdRules/refs/heads/main/dns.txt",
                  "parser": "adguard",
                  "minimum": 100000,
              },
              "AWAvenue": {
                  "url": "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt",
                  "parser": "adguard",
                  "minimum": 400,
              },
          })

          DOMAIN_LABEL_RE = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$", re.IGNORECASE)

          def normalize_domain(value):
              if not isinstance(value, str):
                  return None
              domain = value.strip().lower()
              if not domain:
                  return None
              if domain.startswith("||"):
                  domain = domain[2:]
              if domain.endswith("^"):
                  domain = domain[:-1]
              domain = domain.strip().rstrip(".")
              if not domain:
                  return None
              forbidden = ("*", "/", "\\", "^", "$", "?", "#", ":", "!", " ", "\t", ",")
              if any(ch in domain for ch in forbidden):
                  return None
              try:
                  ipaddress.ip_address(domain)
                  return None
              except ValueError:
                  pass
              if "." not in domain or ".." in domain:
                  return None
              try:
                  domain = domain.encode("idna").decode("ascii").lower()
              except UnicodeError:
                  return None
              if len(domain) > 253:
                  return None
              labels = domain.split(".")
              if len(labels) < 2:
                  return None
              for label in labels:
                  if not DOMAIN_LABEL_RE.fullmatch(label):
                      return None
              if domain.endswith((".local", ".localhost", ".lan", ".internal")):
                  return None
              return domain

          def create_session():
              session = requests.Session()
              retry = Retry(total=3, connect=3, read=3, backoff_factor=1,
                            status_forcelist=(429,500,502,503,504),
                            allowed_methods=frozenset(["GET"]), raise_on_status=False)
              adapter = HTTPAdapter(max_retries=retry, pool_connections=10, pool_maxsize=10)
              session.mount("https://", adapter)
              session.mount("http://", adapter)
              session.headers.update({"User-Agent": USER_AGENT, "Accept": "*/*"})
              return session

          def fetch_text(session, name, url):
              print(f"\n{'='*72}\nDownloading: {name}\nURL: {url}")
              response = session.get(url, timeout=REQUEST_TIMEOUT)
              response.raise_for_status()
              content = response.text
              if not content.strip():
                  raise RuntimeError(f"{name}: downloaded content is empty")
              print(f"HTTP {response.status_code} | {len(content):,} bytes")
              return content

          PURE_ADGUARD_DOMAIN = re.compile(r"^\|\|([a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?)\^$", re.IGNORECASE)

          def parse_adguard(content):
              domains = set()
              for raw_line in content.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith(("!", "#", "[", "@@")):
                      continue
                  match = PURE_ADGUARD_DOMAIN.fullmatch(line)
                  if not match:
                      continue
                  domain = normalize_domain(match.group(1))
                  if domain:
                      domains.add(domain)
              return domains

          SURGE_DOMAIN = re.compile(r"^(DOMAIN|DOMAIN-SUFFIX),([^,\s]+)$", re.IGNORECASE)

          def parse_surge(content):
              domains = set()
              for raw_line in content.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith(("#", "//", ";")):
                      continue
                  match = SURGE_DOMAIN.fullmatch(line)
                  if not match:
                      continue
                  domain = normalize_domain(match.group(2))
                  if domain:
                      domains.add(domain)
              return domains

          def parse_source(parser, content):
              if parser == "adguard":
                  return parse_adguard(content)
              if parser == "surge":
                  return parse_surge(content)
              raise ValueError(f"Unknown parser: {parser}")

          def build_rules():
              session = create_session()
              source_domains = OrderedDict()
              merged = set()
              for name, config in SOURCES.items():
                  content = fetch_text(session, name, config["url"])
                  domains = parse_source(config["parser"], content)
                  count = len(domains)
                  print(f"Parsed valid domains: {count:,}")
                  if count < config["minimum"]:
                      raise RuntimeError(f"{name} failed safety check: {count:,} < {config['minimum']:,}")
                  source_domains[name] = domains
                  merged.update(domains)
              return source_domains, merged

          def print_diagnostics(source_domains, merged):
              print("\n" + "="*72 + "\nSource statistics\n" + "="*72)
              names = list(source_domains.keys())
              for name in names:
                  print(f"{name:<20} {len(source_domains[name]):>12,}")
              print("\nExclusive domains")
              for name in names:
                  others = set()
                  for other in names:
                      if other != name:
                          others.update(source_domains[other])
                  exclusive = source_domains[name] - others
                  print(f"{name:<20} {len(exclusive):>12,}")
              print("\nPairwise intersections")
              for i in range(len(names)):
                  for j in range(i+1, len(names)):
                      a, b = names[i], names[j]
                      overlap = source_domains[a] & source_domains[b]
                      print(f"{a} ∩ {b}: {len(overlap):,}")
              if len(names) >= 3:
                  common = set.intersection(*[source_domains[name] for name in names])
                  print(f"\nAll-source intersection: {len(common):,}")
              print("\nSequential contribution")
              running = set()
              for name in names:
                  before = len(running)
                  running.update(source_domains[name])
                  print(f"{name:<20} +{len(running)-before:>11,}")
              print("-"*72 + f"\n{'Unique merged domains':<20} {len(merged):>12,}\n" + "="*72)

          def generate_yaml(domains):
              domains = sorted(domains)
              # 使用单引号包裹每个域名，防止 YAML 解析错误
              lines = ["domain:"] + [f"  - '{d}'" for d in domains] + [""]
              return "\n".join(lines)

          def validate_output(content):
              data = yaml.safe_load(content)
              if not isinstance(data, dict):
                  raise RuntimeError("Generated YAML root is invalid")
              if "domain" not in data:
                  raise RuntimeError("Generated YAML missing 'domain'")
              payload = data["domain"]
              if not isinstance(payload, list) or not payload:
                  raise RuntimeError("domain list is invalid or empty")
              normalized = []
              for item in payload:
                  domain = normalize_domain(item)
                  if domain != item:
                      raise RuntimeError(f"Invalid generated domain: {item}")
                  normalized.append(domain)
              if len(normalized) != len(set(normalized)):
                  raise RuntimeError("Duplicate domains detected")
              return len(normalized)

          def write_if_changed(path, content):
              old_content = None
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      old_content = f.read()
              if old_content == content:
                  print("\nNo AdBlock content changes detected.")
                  return False
              directory = os.path.dirname(path) or "."
              os.makedirs(directory, exist_ok=True)
              fd, temp_path = tempfile.mkstemp(prefix=".AdBlock.", suffix=".tmp", dir=directory, text=True)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)
                  os.replace(temp_path, path)
              except Exception:
                  try:
                      os.unlink(temp_path)
                  except OSError:
                      pass
                  raise
              return True

          def main():
              print("="*72 + "\nEgern AdBlock Rule Builder\nBuild time: " + datetime.now(timezone.utc).isoformat() + "\n" + "="*72)
              try:
                  source_domains, merged = build_rules()
                  print_diagnostics(source_domains, merged)
                  final_count = len(merged)
                  if final_count < FINAL_MIN_DOMAINS:
                      raise RuntimeError(f"Final domain count suspiciously low: {final_count:,} < {FINAL_MIN_DOMAINS:,}")
                  content = generate_yaml(merged)
                  validated_count = validate_output(content)
                  changed = write_if_changed(OUTPUT_FILE, content)
                  print(f"\n{'='*72}\nSUCCESS: {validated_count:,} domains {'generated' if changed else 'unchanged'}\n{'='*72}")
              except Exception as exc:
                  print(f"\n{'='*72}\nBUILD FAILED\n{str(exc)}\nExisting AdBlock.yaml was preserved.\n{'='*72}")
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PY

      # =====================================================================
      # Step 5: Download and Convert Existing Rules (blackmatrix7 + Lan/AIGC)
      # =====================================================================
      - name: Download and Convert Existing Rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Egern/Rule .build
          python3 <<'PY'
          import os, re, subprocess, tempfile
          from pathlib import Path
          import requests, yaml
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          RULE_DIR = Path("Egern/Rule")
          TEMP_DIR = Path(".build/rules")
          TEMP_DIR.mkdir(parents=True, exist_ok=True)
          REQUEST_TIMEOUT = 30
          USER_AGENT = "Egern-Rule-Builder/2.0"

          def create_session():
              session = requests.Session()
              retry = Retry(total=3, connect=3, read=3, backoff_factor=1,
                            status_forcelist=(429,500,502,503,504),
                            allowed_methods=frozenset(["GET"]), raise_on_status=False)
              adapter = HTTPAdapter(max_retries=retry, pool_connections=10, pool_maxsize=10)
              session.mount("https://", adapter)
              session.mount("http://", adapter)
              session.headers.update({"User-Agent": USER_AGENT, "Accept": "*/*"})
              return session
          SESSION = create_session()

          def download(url):
              print(f"Downloading: {url}")
              response = SESSION.get(url, timeout=REQUEST_TIMEOUT)
              response.raise_for_status()
              text = response.text
              if not text.strip():
                  raise RuntimeError(f"Downloaded content is empty: {url}")
              return text

          RULE_PREFIXES = ("DOMAIN,", "DOMAIN-SUFFIX,", "DOMAIN-KEYWORD,", "DOMAIN-WILDCARD,",
                           "IP-CIDR,", "IP-CIDR6,", "IP-ASN,", "URL-REGEX,", "USER-AGENT,",
                           "DEST-PORT,", "GEOIP,", "PROCESS-NAME,", "AND,", "OR,", "NOT,")

          def clean_rule_line(line):
              line = line.strip()
              if not line or line.startswith(("#", "//", ";", "!")):
                  return None
              if line in ("payload:", "---", "..."):
                  return None
              if line.startswith("- "):
                  line = line[2:].strip()
              # 去除首尾引号（单引号或双引号）
              if len(line) >= 2 and line[0] == line[-1] and line[0] in ("'", '"'):
                  line = line[1:-1].strip()
              line = re.sub(r"\s+#.*$", "", line).strip()
              if not line:
                  return None
              if line.upper().startswith(RULE_PREFIXES):
                  return line
              return None

          def parse_surge(content):
              rules, skipped = [], 0
              for raw in content.splitlines():
                  rule = clean_rule_line(raw)
                  if rule:
                      rules.append(rule)
                  elif raw.strip():
                      skipped += 1
              return rules, skipped

          def parse_egern_yaml(content):
              data = yaml.safe_load(content)
              if not isinstance(data, dict):
                  raise RuntimeError("Egern YAML root must be a mapping")
              rules = []
              for key, val in data.items():
                  if isinstance(val, list):
                      for item in val:
                          if isinstance(item, str):
                              # 如果是带前缀的规则直接添加，否则尝试根据 key 推断（但这里保留）
                              # 实际上 Egern YAML 分组中值不带前缀，但 Surge 转储时带前缀
                              # 我们统一用 clean_rule_line 处理，它会处理带前缀的和不带前缀的
                              # 不过 clean_rule_line 要求带前缀，所以如果 item 不带前缀，我们可以根据 key 补前缀
                              if any(item.upper().startswith(p) for p in RULE_PREFIXES):
                                  rules.append(item)
                              else:
                                  # 尝试根据 key 补前缀（但这里我们信任原始数据是 payload 格式）
                                  pass
              if not rules:
                  payload = data.get("payload")
                  if isinstance(payload, list):
                      for item in payload:
                          if isinstance(item, str):
                              rule = clean_rule_line(item)
                              if rule:
                                  rules.append(rule)
              return rules, 0

          def parse_source(content):
              try:
                  data = yaml.safe_load(content)
                  if isinstance(data, dict) and isinstance(data.get("payload"), list):
                      return parse_egern_yaml(content)
              except Exception:
                  pass
              return parse_surge(content)

          def normalize_rules(rules):
              unique = {}
              for rule in rules:
                  unique[rule.lower()] = rule
              return sorted(unique.values(), key=lambda x: (x.split(",", 1)[0].upper(), x.lower()))

          PREFIX_GROUP = {
              "DOMAIN": "domain",
              "DOMAIN-SUFFIX": "domain_suffix",
              "DOMAIN-KEYWORD": "domain_keyword",
              "DOMAIN-WILDCARD": "domain_wildcard",
              "IP-CIDR": "ip_cidr",
              "IP-CIDR6": "ip_cidr6",
              "IP-ASN": "asn",
              "URL-REGEX": "url_regex",
              "USER-AGENT": "user_agent",
              "DEST-PORT": "dest_port",
              "GEOIP": "geoip",
              "PROCESS-NAME": "process_name",
              "AND": "and",
              "OR": "or",
              "NOT": "not",
          }
          ORDER = ["domain", "domain_suffix", "domain_keyword", "domain_regex", "domain_wildcard",
                   "geoip", "ip_cidr", "ip_cidr6", "asn", "url_regex",
                   "user_agent", "dest_port", "protocol", "rule_set",
                   "ssid", "bssid", "cellular",
                   "and", "or", "not", "default", "process_name"]

          def write_egern_yaml(path, rules):
              groups = {g: [] for g in ORDER}
              for rule in rules:
                  prefix = rule.split(",", 1)[0].upper()
                  value = rule.split(",", 1)[1].strip()
                  group = PREFIX_GROUP.get(prefix)
                  if group:
                      groups[group].append(value)
              groups = {k: sorted(set(v)) for k, v in groups.items() if v}
              if not groups:
                  raise RuntimeError(f"No grouped rules for {path}")
              lines = []
              for key in ORDER:
                  if key in groups:
                      lines.append(f"{key}:")
                      # 用单引号包裹每个值，避免 YAML 解析特殊字符
                      lines.extend(f"  - '{item}'" for item in groups[key])
              content = "\n".join(lines) + "\n"
              data = yaml.safe_load(content)
              if not isinstance(data, dict):
                  raise RuntimeError(f"Invalid YAML generated: {path}")
              total = sum(len(v) for v in data.values() if isinstance(v, list))
              if total == 0:
                  raise RuntimeError(f"No rules generated for {path}")
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, temp_path = tempfile.mkstemp(prefix=f".{path.stem}.", suffix=".tmp", dir=path.parent, text=True)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)
                  os.replace(temp_path, path)
              except Exception:
                  try:
                      os.unlink(temp_path)
                  except OSError:
                      pass
                  raise
              return total

          existing_files = sorted(p.stem for p in RULE_DIR.glob("*.yaml")
                                  if p.name not in ("AdBlock.yaml", "Lan.yaml", "AIGC.yaml"))
          print("\n" + "="*72 + "\nExisting rule files\n" + "="*72)
          if existing_files:
              for name in existing_files:
                  print(f"  {name}")
          else:
              print("  No existing rule files.")

          if existing_files:
              print("\nCloning blackmatrix7/ios_rule_script...")
              subprocess.run(["git", "clone", "--depth", "1",
                              "https://github.com/blackmatrix7/ios_rule_script.git",
                              ".build/BM7_Tmp"], check=True)
              bm7_root = Path(".build/BM7_Tmp/rule/Surge")
              for name in existing_files:
                  candidates = [bm7_root / f"{name}.list"] + list(bm7_root.glob(f"**/{name}.list"))
                  src = next((p for p in candidates if p.is_file()), None)
                  if src is None:
                      print(f"WARNING: {name}.list not found in blackmatrix7.")
                      continue
                  print(f"\nProcessing {name}\nSource: {src}")
                  content = src.read_text(encoding="utf-8-sig")
                  rules, skipped = parse_source(content)
                  count = write_egern_yaml(RULE_DIR / f"{name}.yaml", rules)
                  print(f"Valid rules: {count:,}\nSkipped lines: {skipped:,}")

          LAN_SOURCES = [
              ("blackmatrix7", "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list"),
              ("Repcz", "https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Lan.yaml"),
          ]
          AIGC_SOURCES = [
              ("blackmatrix7/OpenAI", "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list"),
              ("blackmatrix7/Claude", "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list"),
              ("blackmatrix7/Gemini", "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list"),
              ("ConnersHua", "https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/AI.list"),
              ("Repcz", "https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/AI.yaml"),
          ]

          def build_merged_rule(output_name, sources):
              print("\n" + "="*72 + f"\nBuilding {output_name}.yaml\n" + "="*72)
              all_rules, total_skipped = [], 0
              for source_name, url in sources:
                  print(f"\n[{source_name}]")
                  content = download(url)
                  rules, skipped = parse_source(content)
                  if not rules:
                      print(f"Warning: {source_name} returned no valid rules, skipping.")
                      continue
                  print(f"Valid rules: {len(rules):,}\nSkipped lines: {skipped:,}")
                  all_rules.extend(rules)
                  total_skipped += skipped
              if not all_rules:
                  raise RuntimeError(f"{output_name}: no valid rules from any source")
              count = write_egern_yaml(RULE_DIR / f"{output_name}.yaml", all_rules)
              print(f"\n{output_name}: {count:,} unique rules\nTotal skipped lines: {total_skipped:,}")

          build_merged_rule("Lan", LAN_SOURCES)
          build_merged_rule("AIGC", AIGC_SOURCES)
          print("\n" + "="*72 + "\nRule conversion completed successfully.\n" + "="*72)
          PY

      # =====================================================================
      # Step 6: Normalize Rules (convert to grouped format with correct keys)
      # =====================================================================
      - name: Normalize Rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, tempfile, yaml
          RULE_DIR = Path("Egern/Rule")

          PREFIX_GROUP = {
              "DOMAIN": "domain",
              "DOMAIN-SUFFIX": "domain_suffix",
              "DOMAIN-KEYWORD": "domain_keyword",
              "DOMAIN-WILDCARD": "domain_wildcard",
              "IP-CIDR": "ip_cidr",
              "IP-CIDR6": "ip_cidr6",
              "IP-ASN": "asn",
              "URL-REGEX": "url_regex",
              "USER-AGENT": "user_agent",
              "DEST-PORT": "dest_port",
              "GEOIP": "geoip",
              "PROCESS-NAME": "process_name",
              "AND": "and",
              "OR": "or",
              "NOT": "not",
          }
          ORDER = ["domain", "domain_suffix", "domain_keyword", "domain_regex", "domain_wildcard",
                   "geoip", "ip_cidr", "ip_cidr6", "asn", "url_regex",
                   "user_agent", "dest_port", "protocol", "rule_set",
                   "ssid", "bssid", "cellular",
                   "and", "or", "not", "default", "process_name"]

          def normalize_line(line):
              line = line.strip()
              if not line or line.startswith(("#","//",";","!")):
                  return None
              if line == "payload:":
                  return None
              if line.startswith("- "):
                  line = line[2:].strip()
              # 去除引号
              if len(line) >= 2 and line[0] == line[-1] and line[0] in ("'", '"'):
                  line = line[1:-1].strip()
              if not line:
                  return None
              upper = line.upper()
              if any(upper.startswith(k + ",") for k in PREFIX_GROUP):
                  return line
              return None

          for path in sorted(RULE_DIR.glob("*.yaml")):
              if path.name == "AdBlock.yaml":
                  continue
              print(f"Normalizing {path.name}...")
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8-sig"))
              except Exception as exc:
                  raise RuntimeError(f"{path}: YAML parse failed: {exc}")
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path}: YAML root is invalid")
              rules = []
              if "payload" in data and isinstance(data["payload"], list):
                  for item in data["payload"]:
                      if isinstance(item, str):
                          rule = normalize_line(item)
                          if rule:
                              rules.append(rule)
              else:
                  # 如果已经是分组格式，跳过（但我们仍会重新生成以确保引号）
                  valid_keys = set(ORDER)
                  if all(k in valid_keys for k in data.keys()):
                      print(f"  Already in grouped format, re-generating with quoted values.")
                      # 收集所有值，但需要知道前缀映射，但这里我们假定分组正确
                      # 但为了统一，我们仍然从分组中提取值并重新按规则分组
                      # 实际上我们应该直接读取分组值，但为了保留前缀，我们无法从分组键反向得到前缀
                      # 所以我们直接跳过，因为已经符合格式
                      continue
                  print(f"  No valid rules found, skipping.")
                  continue
              if not rules:
                  print(f"  No rules to normalize.")
                  continue
              groups = {g: [] for g in ORDER}
              for rule in rules:
                  prefix = rule.split(",", 1)[0].upper()
                  value = rule.split(",", 1)[1].strip()
                  group = PREFIX_GROUP.get(prefix)
                  if group:
                      groups[group].append(value)
              groups = {k: sorted(set(v)) for k, v in groups.items() if v}
              if not groups:
                  raise RuntimeError(f"{path}: final grouped rules empty")
              lines = []
              for key in ORDER:
                  if key in groups:
                      lines.append(f"{key}:")
                      lines.extend(f"  - '{item}'" for item in groups[key])
              new_content = "\n".join(lines) + "\n"
              data = yaml.safe_load(new_content)
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path}: invalid YAML generated")
              total = sum(len(v) for v in data.values() if isinstance(v, list))
              if total == 0:
                  raise RuntimeError(f"{path}: final payload is empty")
              old_content = path.read_text(encoding="utf-8-sig")
              if old_content != new_content:
                  fd, temp_path = tempfile.mkstemp(prefix=f".{path.stem}.", suffix=".tmp", dir=path.parent, text=True)
                  try:
                      with open(temp_path, "w", encoding="utf-8", newline="\n") as f:
                          f.write(new_content)
                      Path(temp_path).replace(path)
                  except Exception:
                      Path(temp_path).unlink(missing_ok=True)
                      raise
                  print(f"  Updated: {total:,} rules")
              else:
                  print(f"  Unchanged: {total:,} rules")
          print("\nNormalization completed.")
          PY

      # =====================================================================
      # Step 7: Final YAML Validation (check all keys are valid Egern types)
      # =====================================================================
      - name: Final YAML Validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import yaml
          RULE_DIR = Path("Egern/Rule")
          ALLOWED_KEYS = {"domain", "domain_suffix", "domain_keyword", "domain_regex", "domain_wildcard",
                          "geoip", "ip_cidr", "ip_cidr6", "asn", "url_regex",
                          "user_agent", "dest_port", "protocol", "rule_set",
                          "ssid", "bssid", "cellular",
                          "and", "or", "not", "default", "process_name"}
          for path in sorted(RULE_DIR.glob("*.yaml")):
              print(f"Validating {path.name}...")
              with open(path, "r", encoding="utf-8-sig") as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path}: YAML root must be mapping")
              total = 0
              for key, val in data.items():
                  if key not in ALLOWED_KEYS:
                      raise RuntimeError(f"{path}: unknown key '{key}'")
                  if not isinstance(val, list):
                      raise RuntimeError(f"{path}: '{key}' must be a list")
                  if not val:
                      raise RuntimeError(f"{path}: '{key}' is empty")
                  if len(val) != len(set(val)):
                      raise RuntimeError(f"{path}: duplicates in '{key}'")
                  total += len(val)
              if total == 0:
                  raise RuntimeError(f"{path}: no rules found")
              print(f"  OK: {total:,} rules")
          print("\nAll YAML files passed final validation.")
          PY

      # =====================================================================
      # Step 8: Add Stable Headers (using git show HEAD)
      # =====================================================================
      - name: Add Stable Headers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import yaml

          RULE_DIR = Path("Egern/Rule")
          REPO = "jnlaoshu/MySelf"
          BRANCH = "main"
          SOURCE_MAP = {
              "AdBlock": "AdGuard DNS Filter, AdRules, AWAvenue",
              "Lan": "blackmatrix7, Repcz",
              "AIGC": "blackmatrix7, ConnersHua, Repcz",
          }
          DEFAULT_SOURCE = "blackmatrix7/ios_rule_script"
          HEADER_PREFIXES = ("# 规则名称:", "# 规则统计:", "# 规则来源:", "# 引用链接:", "# 更新时间:")
          TIME_PATTERN = re.compile(r"^# 更新时间:\s*(.+?)\s*$", re.MULTILINE)
          current_time = (datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
                          .strftime("%Y-%m-%d %H:%M:%S +0800"))

          def count_rules(content):
              try:
                  data = yaml.safe_load(content)
                  if not isinstance(data, dict):
                      return 0
                  total = 0
                  for val in data.values():
                      if isinstance(val, list):
                          total += len(val)
                  return total
              except:
                  return 0

          def normalize_payload(content):
              try:
                  data = yaml.safe_load(content)
              except:
                  return None
              if not isinstance(data, dict):
                  return None
              items = []
              for val in data.values():
                  if isinstance(val, list):
                      for item in val:
                          if isinstance(item, str):
                              items.append(item.strip().lower())
              return tuple(sorted(set(items)))

          def get_git_head_content(path):
              try:
                  result = subprocess.run(["git", "show", f"HEAD:{path.as_posix()}"],
                                          check=True, capture_output=True, text=True, encoding="utf-8")
                  return result.stdout
              except subprocess.CalledProcessError:
                  return ""

          def get_old_update_time(old_content):
              if not old_content:
                  return None
              match = TIME_PATTERN.search(old_content)
              return match.group(1).strip() if match else None

          def remove_old_headers(content):
              lines = []
              generated_prefixes = ("# Egern AdBlock Rule", "# Total Domains:", "# Sources:", "# Generated by")
              for line in content.splitlines():
                  stripped = line.strip()
                  if any(stripped.startswith(p) for p in HEADER_PREFIXES) or any(stripped.startswith(p) for p in generated_prefixes):
                      continue
                  lines.append(line)
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              return "\n".join(lines)

          for yaml_file in sorted(RULE_DIR.glob("*.yaml")):
              print(f"Processing {yaml_file.name}...")
              current_content = yaml_file.read_text(encoding="utf-8-sig")
              current_payload = normalize_payload(current_content)
              if current_payload is None:
                  raise RuntimeError(f"{yaml_file}: current payload cannot be parsed")
              old_git_content = get_git_head_content(yaml_file)
              if not old_git_content:
                  update_time = current_time
                  state = "new file"
              else:
                  old_payload = normalize_payload(old_git_content)
                  old_time = get_old_update_time(old_git_content)
                  if old_payload is None or old_payload != current_payload:
                      update_time = current_time
                      state = "payload changed"
                  elif old_time:
                      update_time = old_time
                      state = "payload unchanged"
                  else:
                      update_time = current_time
                      state = "missing old timestamp"
              count = count_rules(current_content)
              name = yaml_file.stem
              source = SOURCE_MAP.get(name, DEFAULT_SOURCE)
              url = f"https://raw.githubusercontent.com/{REPO}/{BRANCH}/Egern/Rule/{yaml_file.name}"
              body = remove_old_headers(current_content)
              header = f"# 规则名称: {name}\n# 规则统计: {count}\n# 规则来源: {source}\n# 引用链接: {url}\n# 更新时间: {update_time}\n\n"
              new_content = header + body + "\n"
              if new_content != current_content:
                  yaml_file.write_text(new_content, encoding="utf-8", newline="\n")
                  print("  Header updated")
              else:
                  print("  Header unchanged")
              print(f"  State: {state}\n  Payload: {count:,}\n  Update time: {update_time}")
          print("\nStable header processing completed.")
          PY

      # =====================================================================
      # Step 9: Final Post-Header Validation
      # =====================================================================
      - name: Final Post Header Validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import yaml
          RULE_DIR = Path("Egern/Rule")
          ALLOWED_KEYS = {"domain", "domain_suffix", "domain_keyword", "domain_regex", "domain_wildcard",
                          "geoip", "ip_cidr", "ip_cidr6", "asn", "url_regex",
                          "user_agent", "dest_port", "protocol", "rule_set",
                          "ssid", "bssid", "cellular",
                          "and", "or", "not", "default", "process_name"}
          for path in sorted(RULE_DIR.glob("*.yaml")):
              text = path.read_text(encoding="utf-8-sig")
              data = yaml.safe_load(text)
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path}: invalid YAML root")
              total = 0
              for key, val in data.items():
                  if key not in ALLOWED_KEYS:
                      raise RuntimeError(f"{path}: unknown key '{key}'")
                  if not isinstance(val, list) or not val:
                      raise RuntimeError(f"{path}: invalid or empty list for '{key}'")
                  if len(val) != len(set(val)):
                      raise RuntimeError(f"{path}: duplicates in '{key}'")
                  total += len(val)
              if total == 0:
                  raise RuntimeError(f"{path}: no rules found")
              print(f"OK: {path.name} {total:,} rules")
          print("\nPost-header validation passed.")
          PY

      # =====================================================================
      # Step 10: Commit and Push
      # =====================================================================
      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Egern/Rule/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          echo "Changes detected:"
          git diff --staged --stat
          git commit -m "update(rules): $(date '+%Y-%m-%d %H:%M:%S')"
          git push