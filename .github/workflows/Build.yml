      #   不允许重复。
      #
      # =======================================================================

      - name: Validate All Rules
        run: |

          python3 - << 'PY'

          from pathlib import Path

          import ipaddress
          import re

          import yaml


          RULE_DIR = Path(
              "Egern/Rule"
          )


          DOMAIN_LABEL_RE = re.compile(

              r"^[a-z0-9]"
              r"(?:[a-z0-9-]{0,61}[a-z0-9])?$",

              re.IGNORECASE,
          )


          def valid_domain(
              domain
          ):

              if not isinstance(
                  domain,
                  str,
              ):
                  return False

              domain = domain.strip().lower()

              if (
                  not domain
                  or "." not in domain
                  or ".." in domain
              ):

                  return False

              forbidden = (
                  "*",
                  "/",
                  "\\",
                  "^",
                  "$",
                  "?",
                  "#",
                  ":",
                  "!",
                  " ",
                  ",",
              )

              if any(
                  char in domain
                  for char in forbidden
              ):

                  return False

              try:

                  ipaddress.ip_address(
                      domain
                  )

                  return False

              except ValueError:
                  pass

              try:

                  domain = (
                      domain
                      .encode("idna")
                      .decode("ascii")
                  )

              except UnicodeError:

                  return False

              if len(domain) > 253:

                  return False

              labels = domain.split(".")

              return all(
                  DOMAIN_LABEL_RE.fullmatch(
                      label
                  )
                  for label in labels
              )


          total_files = 0

          total_rules = 0


          for yaml_file in sorted(
              RULE_DIR.glob("*.yaml")
          ):

              total_files += 1

              with open(
                  yaml_file,
                  "r",
                  encoding="utf-8-sig",
              ) as f:

                  data = yaml.safe_load(
                      f
                  )

              if not isinstance(
                  data,
                  dict,
              ):

                  raise RuntimeError(
                      f"{yaml_file.name}: "
                      f"invalid YAML root"
                  )

              payload = data.get(
                  "payload"
              )

              if not isinstance(
                  payload,
                  list,
              ):

                  raise RuntimeError(
                      f"{yaml_file.name}: "
                      f"invalid payload"
                  )

              if len(payload) != len(
                  set(payload)
              ):

                  raise RuntimeError(
                      f"{yaml_file.name}: "
                      f"duplicate rules"
                  )

              for rule in payload:

                  if not isinstance(
                      rule,
                      str,
                  ):

                      raise RuntimeError(
                          f"{yaml_file.name}: "
                          f"non-string rule"
                      )

                  if not rule.strip():

                      raise RuntimeError(
                          f"{yaml_file.name}: "
                          f"empty rule"
                      )

                  if (
                      yaml_file.name
                      == "AdBlock.yaml"
                  ):

                      if not valid_domain(
                          rule
                      ):

                          raise RuntimeError(
                              "AdBlock.yaml: "
                              "invalid domain: "
                              f"{rule}"
                          )

              count = len(payload)

              total_rules += count

              print(
                  f"{yaml_file.name:<32}"
                  f"{count:>12,}"
              )


          print()
          print("=" * 72)

          print(
              f"Rule files : "
              f"{total_files:,}"
          )

          print(
              f"Total rules: "
              f"{total_rules:,}"
          )

          print("=" * 72)

          PY


