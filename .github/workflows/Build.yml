# =============================================================================
# 工作流：Egern 规则自动构建
# 更新：2026.08.15 11:50
#
# 主要功能：
#   - 合并 AdGuard DNS Filter + AdRules + AWAvenue 生成 AdBlock.yaml
#   - 自动检测 Egern/Rule 目录下现有 YAML，同步 blackmatrix7 对应规则
#   - 多源合并 AIGC / Telegram（Lan 已取消多源，走自动同步）
#   - 支持 Manual/*.txt 手动追加规则，Manual/*.exclude.txt 排除规则
#   - 支持 Surge classical / payload YAML / Egern grouped Rule Set YAML
#   - 输出符合 Egern Rule Set 格式的分组 YAML
#   - 正确处理 no_resolve（含一致性检测与警告）
#   - 上游异常、解析归零、最终归零均触发 CI 失败
#   - 特殊规则（如 CGB）强制生成
#   - 两层最终 YAML 校验 + 稳定时间戳比较
#   - 内容未变化时不刷新更新时间，不提交
# =============================================================================
name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: build-egern-rules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "requests==2.32.3" "PyYAML==6.0.2" "urllib3==2.2.3"

      - name: Get date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Rule Sources
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: egern-sources-${{ runner.os }}-${{ steps.date.outputs.date }}

      - name: Build All Rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Egern/Rule .build .cache/sources Manual

          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import ipaddress
          import os
          import re
          import subprocess
          import tempfile
          from collections import OrderedDict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import requests
          import yaml
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          # ------------------------------------------------------------------
          # Constants
          # ------------------------------------------------------------------
          RULE_DIR = Path("Egern/Rule")
          MANUAL_DIR = Path("Manual")
          CACHE_DIR = Path(".cache/sources")
          REQUEST_TIMEOUT = 45
          USER_AGENT = "Egern-Rule-Builder/3.1"

          ADBLOCK_SOURCES = OrderedDict({
              "AdGuard_DNS": {
                  "url": "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt",
                  "parser": "adguard",
                  "minimum": 100_000,
              },
              "AdRules": {
                  "url": "https://raw.githubusercontent.com/Cats-Team/AdRules/refs/heads/main/dns.txt",
                  "parser": "adguard",
                  "minimum": 100_000,
              },
              "AWAvenue": {
                  "url": "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt",
                  "parser": "adguard",
                  "minimum": 400,
              },
          })
          ADBLOCK_FINAL_MIN = 100_000

          # AIGC / Telegram 多源合并
          MERGE_SOURCES = {
              "AIGC": [
                  "blackmatrix7/OpenAI|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list",
                  "blackmatrix7/Claude|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list",
                  "blackmatrix7/Gemini|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list",
                  "ConnersHua|https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/AI.list",
                  "Repcz|https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/AI.yaml",
              ],
              "Telegram": [
                  "blackmatrix7|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list",
                  "SukkaW|https://ruleset.skk.moe/List/ip/telegram.conf",
              ],
          }

          SPECIAL_RULES = {
              "CGB": {
                  "no_resolve": True,
                  "domain_set": ["unavailable.invalid"],
              },
          }

          CLASSIFIED_PREFIX_MAP = {
              "domain_set": "DOMAIN",
              "domain_suffix_set": "DOMAIN-SUFFIX",
              "domain_keyword_set": "DOMAIN-KEYWORD",
              "domain_regex_set": "DOMAIN-REGEX",
              "domain_wildcard_set": "DOMAIN-WILDCARD",
              "ip_cidr_set": "IP-CIDR",
              "ip_cidr6_set": "IP-CIDR6",
              "asn_set": "IP-ASN",
              "geoip_set": "GEOIP",
              "url_regex_set": "URL-REGEX",
              "user_agent_set": "USER-AGENT",
              "dest_port_set": "DEST-PORT",
              "protocol_set": "PROTOCOL",
              "ssid_set": "SSID",
              "bssid_set": "BSSID",
              "cellular_set": "CELLULAR",
              "and_set": "AND",
              "or_set": "OR",
              "not_set": "NOT",
          }

          PREFIX_GROUP = {
              "DOMAIN": "domain_set",
              "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set",
              "DOMAIN-REGEX": "domain_regex_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set",
              "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set",
              "IP6-CIDR": "ip_cidr6_set",
              "IP-ASN": "asn_set",
              "GEOIP": "geoip_set",
              "URL-REGEX": "url_regex_set",
              "USER-AGENT": "user_agent_set",
              "DEST-PORT": "dest_port_set",
              "DST-PORT": "dest_port_set",
              "PROTOCOL": "protocol_set",
              "SSID": "ssid_set",
              "BSSID": "bssid_set",
              "CELLULAR": "cellular_set",
              "AND": "and_set",
              "OR": "or_set",
              "NOT": "not_set",
          }

          RULE_PREFIXES = tuple(f"{p}," for p in PREFIX_GROUP)
          ORDER = list(CLASSIFIED_PREFIX_MAP.keys())
          NO_RESOLVE_TYPES = {"IP-CIDR", "IP-CIDR6", "IP6-CIDR", "IP-ASN", "GEOIP"}
          CLASSIFIED_KEYS = set(CLASSIFIED_PREFIX_MAP)

          DOMAIN_LABEL_RE = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$", re.IGNORECASE)
          PURE_ADGUARD_DOMAIN = re.compile(
              r"^\|\|([a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?)\^?$", re.IGNORECASE
          )
          HOSTS_LINE = re.compile(r"^(?:0\.0\.0\.0\s+|127\.0\.0\.1\s+)?(\S+)$")
          YAML_MAPPING_PATTERN = re.compile(r"^([A-Za-z_][A-Za-z0-9_-]*):(?:\s|$)")

          # ------------------------------------------------------------------
          # Session & Cache
          # ------------------------------------------------------------------
          def create_session() -> requests.Session:
              session = requests.Session()
              retry = Retry(
                  total=4, connect=4, read=4, backoff_factor=1.2,
                  status_forcelist=(429, 500, 502, 503, 504),
                  allowed_methods=frozenset(["GET"]), raise_on_status=False,
              )
              adapter = HTTPAdapter(max_retries=retry, pool_connections=12, pool_maxsize=12)
              session.mount("https://", adapter)
              session.mount("http://", adapter)
              session.headers.update({"User-Agent": USER_AGENT, "Accept": "*/*"})
              return session

          SESSION = create_session()

          def cache_path(url: str) -> Path:
              h = hashlib.sha256(url.encode()).hexdigest()[:24]
              return CACHE_DIR / f"{h}.txt"

          def download(url: str, use_cache: bool = True) -> str:
              print(f"Downloading: {url}")
              cp = cache_path(url)
              if use_cache and cp.exists():
                  content = cp.read_text(encoding="utf-8")
                  if content.strip():
                      print(f"  Cache hit ({len(content):,} bytes)")
                      return content

              response = SESSION.get(url, timeout=REQUEST_TIMEOUT)
              response.raise_for_status()
              content = response.text
              if not content.strip():
                  raise RuntimeError(f"Empty content: {url}")
              sample = content.lstrip()[:600].lower()
              if "<html" in sample or "<!doctype html" in sample:
                  raise RuntimeError(f"Downloaded content appears to be HTML: {url}")

              # 写入缓存
              if use_cache:
                  cp.parent.mkdir(parents=True, exist_ok=True)
                  cp.write_text(content, encoding="utf-8")
              return content

          # ------------------------------------------------------------------
          # Domain normalization
          # ------------------------------------------------------------------
          def normalize_domain(value: str) -> str | None:
              if not isinstance(value, str):
                  return None
              domain = value.strip().lower()
              if not domain:
                  return None
              if domain.startswith("||"):
                  domain = domain[2:]
              if domain.endswith("^"):
                  domain = domain[:-1]
              domain = domain.strip().rstrip(".")
              if not domain:
                  return None
              forbidden = ("*", "/", "\\", "^", "$", "?", "#", ":", "!", " ", "\t", ",")
              if any(ch in domain for ch in forbidden):
                  return None
              try:
                  ipaddress.ip_address(domain)
                  return None
              except ValueError:
                  pass
              if "." not in domain or ".." in domain:
                  return None
              try:
                  domain = domain.encode("idna").decode("ascii").lower()
              except UnicodeError:
                  return None
              if len(domain) > 253:
                  return None
              labels = domain.split(".")
              if len(labels) < 2:
                  return None
              for label in labels:
                  if not DOMAIN_LABEL_RE.fullmatch(label):
                      return None
              if domain.endswith((".local", ".localhost", ".lan", ".internal")):
                  return None
              return domain

          # ------------------------------------------------------------------
          # Parsers
          # ------------------------------------------------------------------
          def parse_adguard(content: str) -> set[str]:
              domains: set[str] = set()
              for raw in content.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("!", "#", "[", "@@")):
                      continue
                  line = re.sub(r"\$.*$", "", line).strip()
                  # 优先 hosts 格式
                  m = HOSTS_LINE.match(line)
                  if m:
                      d = normalize_domain(m.group(1))
                      if d:
                          domains.add(d)
                      continue
                  # 再尝试 ||domain^ 格式
                  match = PURE_ADGUARD_DOMAIN.match(line)
                  if match:
                      d = normalize_domain(match.group(1))
                      if d:
                          domains.add(d)
              return domains

          def clean_rule_line(line: str) -> str | None:
              line = line.strip()
              if not line:
                  return None
              if line.startswith(("#", "//", ";", "!")):
                  return None
              if line in ("payload:", "---", "..."):
                  return None
              if line.startswith("- "):
                  line = line[2:].strip()
              if len(line) >= 2 and line[0] == line[-1] and line[0] in ("'", '"'):
                  line = line[1:-1].strip()
              line = re.sub(r"\s+#.*$", "", line).strip()
              if not line:
                  return None
              upper = line.upper()
              for prefix in RULE_PREFIXES:
                  if upper.startswith(prefix):
                      return line
              return None

          def parse_surge_classical(content: str) -> tuple[list[str], int]:
              rules: list[str] = []
              skipped = 0
              for raw in content.splitlines():
                  rule = clean_rule_line(raw)
                  if rule:
                      rules.append(rule)
                  elif raw.strip():
                      skipped += 1
              if not rules:
                  raise RuntimeError("Classical source contains zero valid rules")
              return rules, skipped

          def looks_like_yaml_mapping(content: str) -> bool:
              for raw in content.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith(("#", "//", ";", "!")):
                      continue
                  if line in ("---", "...", "payload:"):
                      return True
                  if line.startswith("- "):
                      return True
                  if YAML_MAPPING_PATTERN.match(line):
                      return True
                  return False
              return False

          def get_rule_prefix(rule: str) -> str:
              return rule.split(",", 1)[0].strip().upper()

          def has_no_resolve(rule: str) -> bool:
              parts = [p.strip().lower() for p in rule.split(",")]
              return "no-resolve" in parts[2:]

          def add_no_resolve(rule: str) -> str:
              if has_no_resolve(rule):
                  return rule
              if get_rule_prefix(rule) not in NO_RESOLVE_TYPES:
                  return rule
              return rule + ",no-resolve"

          def parse_payload_yaml(data: dict) -> tuple[list[str], int]:
              if "payload" not in data:
                  raise RuntimeError("payload YAML missing 'payload'")
              payload = data["payload"]
              if not isinstance(payload, list):
                  raise RuntimeError("payload must be a list")
              top_no_resolve = data.get("no_resolve", False)
              if not isinstance(top_no_resolve, bool):
                  raise RuntimeError("no_resolve must be boolean")
              rules: list[str] = []
              for item in payload:
                  if not isinstance(item, str):
                      continue
                  rule = clean_rule_line(item)
                  if not rule:
                      continue
                  if top_no_resolve:
                      rule = add_no_resolve(rule)
                  rules.append(rule)
              if not rules:
                  raise RuntimeError("payload YAML contains zero valid rules")
              return rules, 0

          def parse_classified_yaml(data: dict) -> tuple[list[str], int]:
              recognized = set(data.keys()) & CLASSIFIED_KEYS
              if not recognized:
                  raise RuntimeError("No recognized Egern Rule Set keys")
              no_resolve = data.get("no_resolve", False)
              if not isinstance(no_resolve, bool):
                  raise RuntimeError("no_resolve must be boolean")
              unknown = set(data.keys()) - CLASSIFIED_KEYS - {"no_resolve"}
              if unknown:
                  raise RuntimeError("Unsupported keys: " + ", ".join(sorted(unknown)))
              rules: list[str] = []
              for key in ORDER:
                  if key not in data:
                      continue
                  values = data[key]
                  if not isinstance(values, list):
                      raise RuntimeError(f"{key} must be a list")
                  prefix = CLASSIFIED_PREFIX_MAP[key]
                  for item in values:
                      if not isinstance(item, str):
                          raise RuntimeError(f"{key} contains non-string")
                      value = item.strip()
                      if not value:
                          continue
                      rule = f"{prefix},{value}"
                      if no_resolve and prefix in NO_RESOLVE_TYPES:
                          rule = add_no_resolve(rule)
                      rules.append(rule)
              if recognized and not rules:
                  raise RuntimeError("Recognized keys present but all lists empty")
              return rules, 0

          def parse_source(content: str) -> tuple[list[str], int]:
              if looks_like_yaml_mapping(content):
                  try:
                      data = yaml.safe_load(content)
                  except Exception as exc:
                      raise RuntimeError(f"YAML parse failed: {exc}") from exc
                  if data is None:
                      raise RuntimeError("YAML parsed to None")
                  if not isinstance(data, dict):
                      raise RuntimeError(f"YAML root must be mapping, got {type(data).__name__}")
                  if "payload" in data:
                      return parse_payload_yaml(data)
                  if any(k in CLASSIFIED_KEYS for k in data):
                      return parse_classified_yaml(data)
                  raise RuntimeError("YAML mapping has no recognized rule structure")
              return parse_surge_classical(content)

          # ------------------------------------------------------------------
          # Write helpers
          # ------------------------------------------------------------------
          def yaml_scalar(value: str) -> str:
              # 直接返回字符串，避免 safe_dump 导致的多行检查问题。
              # 后续 write_egern_yaml 会用 yaml.safe_load 验证整个内容。
              return value

          def normalize_rules(rules: list[str]) -> list[str]:
              unique: dict[str, str] = {}
              for rule in rules:
                  clean = rule.strip()
                  if clean:
                      unique[clean.lower()] = clean
              return sorted(
                  unique.values(),
                  key=lambda x: (x.split(",", 1)[0].upper(), x.lower()),
              )

          def check_no_resolve_consistency(rules: list[str]) -> bool:
              ip_rules = [r for r in rules if get_rule_prefix(r) in NO_RESOLVE_TYPES]
              if not ip_rules:
                  return True
              has_flag = [r for r in ip_rules if "no-resolve" in r.lower()]
              if has_flag and len(has_flag) != len(ip_rules):
                  print("  WARNING: Mixed no-resolve in IP rules → force file-level no_resolve: true")
                  return False
              return True

          def write_egern_yaml(path: Path, rules: list[str]) -> int:
              rules = normalize_rules(rules)
              if not rules:
                  raise RuntimeError(f"No valid rules for {path}")

              inconsistent = not check_no_resolve_consistency(rules)
              groups: dict[str, list[str]] = {k: [] for k in ORDER}
              needs_no_resolve = inconsistent

              for rule in rules:
                  parts = rule.split(",", 1)
                  if len(parts) != 2:
                      continue
                  prefix = parts[0].strip().upper()
                  value = parts[1].strip()
                  group = PREFIX_GROUP.get(prefix)
                  if not group:
                      continue

                  if prefix in NO_RESOLVE_TYPES:
                      value_parts = [p.strip() for p in value.split(",")]
                      filtered = [p for p in value_parts if p.lower() != "no-resolve"]
                      if len(filtered) != len(value_parts):
                          needs_no_resolve = True
                      if prefix != "GEOIP" and len(filtered) > 1:
                          print(f"  WARNING: Extra parameters dropped in {rule}")
                          filtered = filtered[:1]
                      value = ",".join(filtered)

                  if not value:
                      continue
                  groups[group].append(value)

              groups = {
                  k: sorted(set(v), key=str.lower)
                  for k, v in groups.items()
                  if v
              }
              if not groups:
                  raise RuntimeError(f"No grouped rules for {path}")

              lines: list[str] = []
              if needs_no_resolve:
                  lines.append("no_resolve: true")
              for key in ORDER:
                  if key in groups:
                      lines.append(f"{key}:")
                      for item in groups[key]:
                          lines.append(f"  - {yaml_scalar(item)}")

              content = "\n".join(lines) + "\n"
              try:
                  data = yaml.safe_load(content)
              except Exception as exc:
                  raise RuntimeError(f"Invalid generated YAML {path}: {exc}") from exc
              if not isinstance(data, dict):
                  raise RuntimeError(f"Invalid YAML root: {path}")
              total = sum(
                  len(v) for k, v in data.items()
                  if k != "no_resolve" and isinstance(v, list)
              )
              if total == 0:
                  raise RuntimeError(f"Zero rules generated for {path}")

              path.parent.mkdir(parents=True, exist_ok=True)
              fd, tmp = tempfile.mkstemp(
                  prefix=f".{path.stem}.", suffix=".tmp", dir=path.parent, text=True
              )
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)
                  Path(tmp).replace(path)
              except Exception:
                  Path(tmp).unlink(missing_ok=True)
                  raise
              return total

          def write_if_changed(path: Path, content: str) -> bool:
              old = path.read_text(encoding="utf-8") if path.exists() else None
              if old == content:
                  return False
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, tmp = tempfile.mkstemp(
                  prefix=f".{path.stem}.", suffix=".tmp", dir=path.parent, text=True
              )
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)
                  Path(tmp).replace(path)
              except Exception:
                  Path(tmp).unlink(missing_ok=True)
                  raise
              return True

          # ------------------------------------------------------------------
          # Manual rules（支持所有规则）
          # ------------------------------------------------------------------
          def load_manual_additions(name: str) -> list[str]:
              path = MANUAL_DIR / f"{name}.txt"
              if not path.exists():
                  return []
              print(f"  Loading manual additions: {path}")
              rules: list[str] = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  rule = clean_rule_line(line)
                  if not rule:
                      continue
                  if rule.upper().startswith(("DOMAIN,", "DOMAIN-SUFFIX,")):
                      parts = rule.split(",", 1)
                      if len(parts) == 2:
                          d = normalize_domain(parts[1])
                          if d:
                              rule = f"{parts[0]},{d}"
                          else:
                              print(f"    WARNING: invalid domain skipped: {parts[1]}")
                              continue
                  rules.append(rule)
              if rules:
                  print(f"    +{len(rules):,} manual rules")
              return rules

          def apply_exclusions(name: str, rules: list[str]) -> list[str]:
              path = MANUAL_DIR / f"{name}.exclude.txt"
              if not path.exists():
                  return rules
              patterns = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  s = line.strip()
                  if s and not s.startswith(("#", "//", ";")):
                      patterns.append(s.lower())
              if not patterns:
                  return rules
              print(f"  Loading exclusions: {path} ({len(patterns)} patterns)")
              filtered = [r for r in rules if not any(p in r.lower() for p in patterns)]
              excluded = len(rules) - len(filtered)
              if excluded:
                  print(f"    Excluded {excluded:,} rules")
              return filtered

          # ------------------------------------------------------------------
          # 1. AdBlock
          # ------------------------------------------------------------------
          def build_adblock() -> None:
              print("\n" + "=" * 72)
              print("Building AdBlock.yaml")
              print("=" * 72)
              source_domains: OrderedDict[str, set[str]] = OrderedDict()
              merged: set[str] = set()

              for name, cfg in ADBLOCK_SOURCES.items():
                  content = download(cfg["url"])
                  domains = parse_adguard(content)
                  count = len(domains)
                  print(f"  {name}: {count:,} domains")
                  if count < cfg["minimum"]:
                      raise RuntimeError(
                          f"{name} safety check failed: {count:,} < {cfg['minimum']:,}"
                      )
                  source_domains[name] = domains
                  merged.update(domains)

              print("\nSource statistics")
              for n, ds in source_domains.items():
                  print(f"  {n:<20} {len(ds):>12,}")
              print(f"  {'Unique merged':<20} {len(merged):>12,}")

              if len(merged) < ADBLOCK_FINAL_MIN:
                  raise RuntimeError(
                      f"Final AdBlock count too low: {len(merged):,} < {ADBLOCK_FINAL_MIN:,}"
                  )

              extra = load_manual_additions("AdBlock")
              for r in extra:
                  upper = r.upper()
                  if upper.startswith(("DOMAIN,", "DOMAIN-SUFFIX,")):
                      d = normalize_domain(r.split(",", 1)[1])
                      if d:
                          merged.add(d)

              exclude_file = MANUAL_DIR / "AdBlock.exclude.txt"
              if exclude_file.exists():
                  excl = {
                      line.strip().lower()
                      for line in exclude_file.read_text(encoding="utf-8").splitlines()
                      if line.strip() and not line.strip().startswith(("#", "//", ";"))
                  }
                  before = len(merged)
                  merged = {d for d in merged if d not in excl}
                  print(f"  Excluded {before - len(merged):,} domains from AdBlock.exclude.txt")

              content = "domain_set:\n" + "\n".join(f"  - {d}" for d in sorted(merged)) + "\n"
              data = yaml.safe_load(content)
              if not isinstance(data, dict) or "domain_set" not in data:
                  raise RuntimeError("AdBlock YAML structure invalid")
              if len(data["domain_set"]) != len(set(data["domain_set"])):
                  raise RuntimeError("Duplicate domains in AdBlock")

              changed = write_if_changed(RULE_DIR / "AdBlock.yaml", content)
              state = "generated" if changed else "unchanged"
              print(f"\nAdBlock: {len(merged):,} domains → {state}")

          # ------------------------------------------------------------------
          # 2. Special rules
          # ------------------------------------------------------------------
          def build_special() -> None:
              for name, data in SPECIAL_RULES.items():
                  path = RULE_DIR / f"{name}.yaml"
                  rules: list[str] = []
                  no_resolve = data.get("no_resolve", False)
                  for key, values in data.items():
                      if key == "no_resolve":
                          continue
                      if not isinstance(values, list):
                          raise RuntimeError(f"{name}.{key} must be list")
                      prefix = CLASSIFIED_PREFIX_MAP.get(key)
                      if not prefix:
                          raise RuntimeError(f"Unknown key in special rule: {key}")
                      for v in values:
                          rule = f"{prefix},{v}"
                          if no_resolve and prefix in NO_RESOLVE_TYPES:
                              rule = add_no_resolve(rule)
                          rules.append(rule)
                  count = write_egern_yaml(path, rules)
                  print(f"Special rule {name}: {count} rules written")

          # ------------------------------------------------------------------
          # 3. blackmatrix7 自动同步（根据现有文件检测，非显式列表）
          # ------------------------------------------------------------------
          def build_blackmatrix7() -> None:
              merge_names = set(MERGE_SOURCES)
              excluded = merge_names | {"AdBlock"} | set(SPECIAL_RULES)
              existing = sorted(
                  p.stem for p in RULE_DIR.glob("*.yaml") if p.stem not in excluded
              )
              print("\n" + "=" * 72)
              print("Detected blackmatrix7 rules to sync (folder-based)")
              print("=" * 72)
              if not existing:
                  print("  (none)")
                  return
              for n in existing:
                  print(f"  {n}")

              missing: list[str] = []
              for name in existing:
                  raw_url = (
                      f"https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/"
                      f"master/rule/Surge/{name}/{name}.list"
                  )
                  try:
                      content = download(raw_url)
                      print(f"\nProcessing {name} (Raw)")
                      rules, skipped = parse_source(content)
                      rules.extend(load_manual_additions(name))
                      rules = apply_exclusions(name, rules)
                      if not rules:
                          raise RuntimeError(f"{name}: zero rules after manual processing")
                      count = write_egern_yaml(RULE_DIR / f"{name}.yaml", rules)
                      print(f"  → {count:,} rules (skipped {skipped})")
                  except Exception as exc:
                      print(f"  Raw failed for {name}: {exc}")
                      missing.append(name)

              if not missing:
                  return

              print("\n" + "=" * 72)
              print("Fallback: sparse clone blackmatrix7")
              print("=" * 72)
              subprocess.run(
                  [
                      "git", "clone", "--depth", "1", "--filter=blob:none", "--sparse",
                      "https://github.com/blackmatrix7/ios_rule_script.git",
                      ".build/BM7_Tmp",
                  ],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", ".build/BM7_Tmp", "sparse-checkout", "set", "rule/Surge"],
                  check=True,
              )
              bm7_root = Path(".build/BM7_Tmp/rule/Surge")
              for name in missing:
                  candidates = [bm7_root / f"{name}.list"] + list(
                      bm7_root.glob(f"**/{name}.list")
                  )
                  src = next((p for p in candidates if p.is_file()), None)
                  if src is None:
                      raise RuntimeError(f"blackmatrix7 source not found: {name}.list")
                  print(f"\nProcessing {name} (sparse: {src})")
                  content = src.read_text(encoding="utf-8-sig")
                  rules, skipped = parse_source(content)
                  rules.extend(load_manual_additions(name))
                  rules = apply_exclusions(name, rules)
                  if not rules:
                      raise RuntimeError(f"{name}: zero rules after manual processing")
                  count = write_egern_yaml(RULE_DIR / f"{name}.yaml", rules)
                  print(f"  → {count:,} rules (skipped {skipped})")

          # ------------------------------------------------------------------
          # 4. Multi-source merges（仅 AIGC / Telegram）
          # ------------------------------------------------------------------
          def build_merged(name: str, sources: list[str]) -> None:
              print("\n" + "=" * 72)
              print(f"Building {name}.yaml")
              print("=" * 72)
              all_rules: list[str] = []
              total_skipped = 0
              for item in sources:
                  src_name, url = item.split("|", 1)
                  print(f"\n[{src_name}]")
                  content = download(url)
                  rules, skipped = parse_source(content)
                  if not rules:
                      raise RuntimeError(f"{name}/{src_name}: zero valid rules")
                  print(f"  Valid: {len(rules):,}  Skipped: {skipped}")
                  all_rules.extend(rules)
                  total_skipped += skipped

              all_rules.extend(load_manual_additions(name))
              all_rules = apply_exclusions(name, all_rules)
              if not all_rules:
                  raise RuntimeError(f"{name}: all rules removed after exclusions")
              count = write_egern_yaml(RULE_DIR / f"{name}.yaml", all_rules)
              print(f"\n{name}: {count:,} unique rules (total skipped {total_skipped})")

          # ------------------------------------------------------------------
          # Main
          # ------------------------------------------------------------------
          def main() -> None:
              print("=" * 72)
              print("Egern Unified Rule Builder")
              print(f"Build time (UTC): {datetime.now(timezone.utc).isoformat()}")
              print("=" * 72)

              build_adblock()
              build_special()
              build_blackmatrix7()
              for name, sources in MERGE_SOURCES.items():
                  build_merged(name, sources)

              print("\n" + "=" * 72)
              print("All rules built successfully.")
              print("=" * 72)

          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  print(f"\n{'=' * 72}\nBUILD FAILED\n{e}\n{'=' * 72}")
                  raise SystemExit(1)
          PY

      - name: Final YAML Validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ipaddress
          import re
          from pathlib import Path
          import yaml

          RULE_DIR = Path("Egern/Rule")
          ALLOWED_KEYS = {
              "domain_set", "domain_suffix_set", "domain_keyword_set",
              "domain_regex_set", "domain_wildcard_set",
              "geoip_set", "ip_cidr_set", "ip_cidr6_set", "asn_set",
              "url_regex_set", "user_agent_set", "dest_port_set",
              "protocol_set", "ssid_set", "bssid_set", "cellular_set",
              "and_set", "or_set", "not_set", "no_resolve",
          }
          DOMAIN_LABEL_RE = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$")

          def validate_domain(value: str, *, allow_wildcard=False, allow_single_label=False) -> bool:
              if not isinstance(value, str):
                  return False
              value = value.strip()
              if not value:
                  return False
              if any(c in value for c in ("/", "\\", ",", " ", "\t", "\n", "\r")):
                  return False
              if not allow_wildcard and ("*" in value or "?" in value):
                  return False
              if allow_wildcard:
                  value = value.replace("*", "x").replace("?", "x")
              value = value.rstrip(".")
              if not value:
                  return False
              try:
                  ipaddress.ip_address(value)
                  return False
              except ValueError:
                  pass
              if len(value) > 253:
                  return False
              labels = value.split(".")
              if not allow_single_label and len(labels) < 2:
                  return False
              return all(DOMAIN_LABEL_RE.fullmatch(lb) for lb in labels)

          def validate_keyword(value: str) -> bool:
              if not isinstance(value, str):
                  return False
              value = value.strip()
              return bool(value) and not any(c in value for c in ("\n", "\r", "\t", ","))

          summary = []
          for path in sorted(RULE_DIR.glob("*.yaml")):
              print(f"Validating {path.name}...")
              text = path.read_text(encoding="utf-8-sig")
              try:
                  data = yaml.safe_load(text)
              except Exception as e:
                  raise RuntimeError(f"{path}: YAML parse failed: {e}") from e
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path}: root must be mapping")

              total = 0
              for key, values in data.items():
                  if key not in ALLOWED_KEYS:
                      raise RuntimeError(f"{path}: unknown key '{key}'")
                  if key == "no_resolve":
                      if not isinstance(values, bool):
                          raise RuntimeError(f"{path}: no_resolve must be bool")
                      continue
                  if not isinstance(values, list):
                      raise RuntimeError(f"{path}: '{key}' must be list")
                  if not values:
                      raise RuntimeError(f"{path}: '{key}' is empty")
                  if any(not isinstance(v, str) for v in values):
                      raise RuntimeError(f"{path}: '{key}' contains non-string")
                  if len(values) != len(set(values)):
                      raise RuntimeError(f"{path}: duplicates in '{key}'")

                  if key == "domain_set":
                      for v in values:
                          if not validate_domain(v, allow_single_label=False):
                              raise RuntimeError(f"{path}: invalid domain: {v!r}")
                  elif key == "domain_suffix_set":
                      for v in values:
                          if not validate_domain(v, allow_single_label=True):
                              raise RuntimeError(f"{path}: invalid suffix: {v!r}")
                  elif key == "domain_wildcard_set":
                      for v in values:
                          if not validate_domain(v, allow_wildcard=True):
                              raise RuntimeError(f"{path}: invalid wildcard: {v!r}")
                  elif key == "domain_keyword_set":
                      for v in values:
                          if not validate_keyword(v):
                              raise RuntimeError(f"{path}: invalid keyword: {v!r}")
                  total += len(values)

              if total == 0:
                  raise RuntimeError(f"{path}: no rules found")
              print(f"  OK → {total:,} rules")
              summary.append((path.name, total))

          print("\n" + "=" * 50)
          print("Validation Summary")
          print("=" * 50)
          for name, cnt in summary:
              print(f"  {name:<30} {cnt:>10,}")
          print("=" * 50)
          print("All YAML files passed final validation.")
          PY

      - name: Add Stable Headers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import yaml

          RULE_DIR = Path("Egern/Rule")
          REPO = os.environ.get("GITHUB_REPOSITORY", "jnlaoshu/MySelf")
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")

          SOURCE_MAP = {
              "AdBlock": "AdGuard DNS Filter, AdRules, AWAvenue",
              "AIGC": "blackmatrix7, ConnersHua, Repcz",
              "Telegram": "blackmatrix7, SukkaW",
          }
          DEFAULT_SOURCE = "blackmatrix7/ios_rule_script"

          HEADER_PREFIXES = (
              "# 规则名称:", "# 规则统计:", "# 规则来源:",
              "# 引用链接:", "# 更新时间:",
          )
          OLD_HEADER_PREFIXES = (
              "# Egern AdBlock Rule", "# Total Domains:",
              "# Sources:", "# Generated by",
          )
          TIME_PATTERN = re.compile(r"^# 更新时间:\s*(.+?)\s*$", re.MULTILINE)

          bj_time = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
          current_time = bj_time.strftime("%Y-%m-%d %H:%M:%S")

          def count_rules(content: str) -> int:
              try:
                  data = yaml.safe_load(content)
              except Exception:
                  return 0
              if not isinstance(data, dict):
                  return 0
              return sum(
                  len(v) for k, v in data.items()
                  if k != "no_resolve" and isinstance(v, list)
              )

          def semantic_payload(content: str):
              try:
                  data = yaml.safe_load(content)
              except Exception:
                  return None
              if not isinstance(data, dict):
                  return None
              no_resolve = bool(data.get("no_resolve", False))
              items = []
              for key, values in data.items():
                  if key == "no_resolve" or not isinstance(values, list):
                      continue
                  for value in values:
                      if isinstance(value, str):
                          if key in ("domain_regex_set", "url_regex_set", "user_agent_set"):
                              normalized = value.strip()
                          else:
                              normalized = value.strip().lower()
                          items.append((key, normalized))
              return (no_resolve, tuple(sorted(set(items))))

          def get_git_head_content(path: Path) -> str:
              try:
                  r = subprocess.run(
                      ["git", "show", f"HEAD:{path.as_posix()}"],
                      check=True, capture_output=True, text=True, encoding="utf-8",
                  )
                  return r.stdout
              except subprocess.CalledProcessError:
                  return ""

          def get_old_update_time(old: str) -> str | None:
              if not old:
                  return None
              m = TIME_PATTERN.search(old)
              return m.group(1).strip() if m else None

          def remove_old_headers(content: str) -> str:
              lines = []
              for line in content.splitlines():
                  s = line.strip()
                  if any(s.startswith(p) for p in HEADER_PREFIXES) or \
                     any(s.startswith(p) for p in OLD_HEADER_PREFIXES):
                      continue
                  lines.append(line)
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              return "\n".join(lines)

          for yaml_file in sorted(RULE_DIR.glob("*.yaml")):
              print(f"Processing {yaml_file.name}...")
              current = yaml_file.read_text(encoding="utf-8-sig")
              current_payload = semantic_payload(current)
              if current_payload is None:
                  raise RuntimeError(f"{yaml_file}: cannot parse current payload")

              old_git = get_git_head_content(yaml_file)
              if not old_git:
                  update_time = current_time
                  state = "new file"
              else:
                  old_payload = semantic_payload(old_git)
                  old_time = get_old_update_time(old_git)
                  if old_payload is None or old_payload != current_payload:
                      update_time = current_time
                      state = "payload changed"
                  elif old_time:
                      update_time = old_time
                      state = "payload unchanged"
                  else:
                      update_time = current_time
                      state = "missing old timestamp"

              count = count_rules(current)
              name = yaml_file.stem
              source = SOURCE_MAP.get(name, DEFAULT_SOURCE)
              url = f"https://raw.githubusercontent.com/{REPO}/{BRANCH}/Egern/Rule/{yaml_file.name}"
              body = remove_old_headers(current)
              header = (
                  f"# 规则名称: {name}\n"
                  f"# 规则统计: {count}\n"
                  f"# 规则来源: {source}\n"
                  f"# 引用链接: {url}\n"
                  f"# 更新时间: {update_time}\n\n"
              )
              new_content = header + body + "\n"
              if new_content != current:
                  yaml_file.write_text(new_content, encoding="utf-8", newline="\n")
                  print("  Header updated")
              else:
                  print("  Header unchanged")
              print(f"  State: {state} | Payload: {count:,} | Time: {update_time}")

          print("\nStable header processing completed.")
          PY

