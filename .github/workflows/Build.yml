      - name: Pull and Push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add Egern/Rule/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Changes detected:"
          git diff --staged --stat

          git commit -m "update(rules): $(date '+%Y-%m-%d %H:%M:%S')"

          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}"; then
              break
            fi
            echo "Pull rebase failed (attempt $i), retrying..."
            sleep $((i * 3))
          done

          for i in 1 2 3; do
            if git push --force-with-lease origin "${GITHUB_REF_NAME:-main}"; then
              echo "Push succeeded (force-with-lease)."
              exit 0
            fi
            echo "force-with-lease failed (attempt $i), trying normal push..."
            if git push origin "${GITHUB_REF_NAME:-main}"; then
              echo "Push succeeded (normal)."
              exit 0
            fi
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          done

          echo "Push ultimately failed after retries."
          exit 1