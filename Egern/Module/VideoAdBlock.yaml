[Rewrite]
# ==================== YouTube ====================
# 视频流广告分段：跳过 ctier=L 广告层级，直接重定向到正常清晰度分段
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?&ctier=L(&.+?),ctier,(.+) 302 https://$1$2$3
# 拦截带 &oad 广告标记的媒体分段请求（排除广告投放本身与正常播放请求，避免误伤播放）
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject-200
# 拦截广告统计上报与 pagead / ptracking 打点
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject-200

[Script]
# ==================== 优酷 脚本 ====================
Youku_Script = type=http-response, pattern=^https?:\/\/.*\.youku\.com\/(v3\/play\/ad|v5\/play\/ad|adn\/(p|x)lay|api\/ad|play\/preroll|live\/ad)\/.*, requires-body=true, max-size=-1, timeout=20, script-path=https://gist.githubusercontent.com/ddgksf2013/5b431857f8b88acbc7ac2453a21e676a/raw/youku.adblock.js

# ==================== YouTube 脚本 (Maasea Protobuf，覆盖 browse/next/player/search/reel/guide/setting/log_event/config) ====================
YTM_Response = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$, requires-body=true, binary-body-mode=true, max-size=-1, timeout=20, argument={"lyricLang":"off","captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true,"debug":false}, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
# 播放初始化请求：移除广告请求参数
YTM_Request_Init = type=http-request, pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*, requires-body=true, binary-body-mode=true, max-size=-1, timeout=20, argument={"captionLang":"off"}, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js
# 拦截前端埋点上报（log_event），减少广告相关行为回传
YTM_Request_Log = type=http-request, pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event, requires-body=true, binary-body-mode=true, max-size=-1, timeout=20, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

[MITM]
hostname = *.bilibili.com, *.disneyplus.com, *.googlevideo.com, redirector*.googlevideo.com, *.hbomax.com, *.iqiyi.com, *.max.com, *.mgtv.com, *.netflix.com, *.qq.com, *.youku.com, www.youtube.com, s.youtube.com, youtubei.googleapis.com