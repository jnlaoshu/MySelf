# —— 第三方：App 开屏广告跳过（MITM 脚本类，第三方域名托管，注意其 MITM 范围）——
- name: App开屏广告跳过
  url: https://yfamilys.com/module/adultraplus.sgmodule
  update_interval: 86400
  enabled: true