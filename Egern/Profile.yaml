    - domain_suffix: { match: alicdn.com, value: AliDNS }
    - domain_suffix: { match: aliyun.com, value: AliDNS }
    - domain_suffix: { match: aliyuncs.com, value: AliDNS }
    - domain_suffix: { match: taobao.com, value: AliDNS }
    - domain_suffix: { match: tmall.com, value: AliDNS }
    - domain_suffix: { match: amap.com, value: AliDNS }
    - domain_suffix: { match: ele.me, value: AliDNS }
    - domain_suffix: { match: dingtalk.com, value: AliDNS }
    - domain_suffix: { match: qq.com, value: DNSPod }
    - domain_suffix: { match: wechat.com, value: DNSPod }
    - domain_suffix: { match: weixin.com, value: DNSPod }
    - domain_suffix: { match: tencent.com, value: DNSPod }
    - domain_suffix: { match: qcloud.com, value: DNSPod }
    - domain_suffix: { match: myqcloud.com, value: DNSPod }
    - domain_suffix: { match: tencdns.cn, value: DNSPod }
    - domain_suffix: { match: bytedance.com, value: ByteDNS }
    - domain_suffix: { match: bytecdn.com, value: ByteDNS }
    - domain_suffix: { match: bytecdn.cn, value: ByteDNS }
    - domain_suffix: { match: bytedns.net, value: ByteDNS }
    - domain_suffix: { match: bytednsdoc.com, value: ByteDNS }
