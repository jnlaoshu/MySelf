# ==================== MITM ====================
mitm:
  ca_p12: egern.p12
  ca_passphrase: egern
  hostnames:
    excludes: ["*.wechat.com", "*.weixin.com", "*.alipay.com", "*.microsoft.com", "*.live.com", "*.office.com", "*.icloud.com", "*.amazonaws.com", "*.githubassets.com", "*.gstatic.com", "*.googleapis.com", "*.googlevideo.com", "*.akamai.net", "*.facebook.com", "*.fbcdn.net", "*.instagram.com", "*.whatsapp.net", "*.cloudflare.com", "*.pages.dev", "*.openai.com", "*.anthropic.com", "*.claude.ai", "*.googleusercontent.com"]
    includes: [raw.githubusercontent.com, gist.githubusercontent.com]

# ==================== 路由规则 ====================
rules:
  # 1. 局域网直连
  - rule_set: { match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/Lan.yaml, policy: DIRECT, update_interval: 604800 }

  # 2. 广告拦截 - 域名类
  - rule_set: { match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/AdBlock.yaml, policy: 猎杀广告, update_interval: 86400 }
  - rule_set: { match: https://ruleset.skk.moe/List/non_ip/reject.conf, policy: 猎杀广告, update_interval: 86400 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/BlockHttpDNS/BlockHttpDNS.list, policy: 猎杀广告, update_interval: 604800 }

  # 3. 常见国内 App 直连
  - domain_keyword: { match: snssdk, policy: DIRECT }
  - domain_keyword: { match: aweme, policy: DIRECT }
  - domain_keyword: { match: amemv, policy: DIRECT }
  - domain_keyword: { match: bytecdn, policy: DIRECT }
  - domain_keyword: { match: toutiao, policy: DIRECT }
  - domain_keyword: { match: douyin, policy: DIRECT }
  - domain_keyword: { match: pstatp, policy: DIRECT }
  - domain_keyword: { match: kuaishou, policy: DIRECT }
  - domain_keyword: { match: gifshow, policy: DIRECT }
  - domain_keyword: { match: yximgs, policy: DIRECT }
  - domain_suffix: { match: edith.xiaohongshu.com, policy: DIRECT }
  - domain_suffix: { match: www.xiaohongshu.com, policy: DIRECT }

  # 4. 广告拦截 - IP 类
  - rule_set: { match: https://ruleset.skk.moe/List/ip/reject.conf, policy: 猎杀广告, update_interval: 86400 }

  # 5. Apple 服务与隐私代理分流
  - domain_suffix: { match: privatecloudcompute.apple.com, policy: Apple }
  - domain_suffix: { match: pcc.apple.com, policy: Apple }
  - domain_suffix: { match: private-relay.apple.com, policy: Apple }
  - domain_suffix: { match: apple-relay.apple.com, policy: Apple }
  - domain_suffix: { match: icloud-content.com, policy: Apple }
  - domain_suffix: { match: mask.apple-dns.net, policy: Apple }
  - domain_suffix: { match: mask.icloud.com, policy: Apple }
  - rule_set: { match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/Apple.yaml, policy: Apple, update_interval: 604800 }

  # 6. AI 服务核心闭环
  - rule_set: { match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/AIGC.yaml, policy: AIGC, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list, policy: Google, update_interval: 604800 }

  # 7. 微软 / GitHub / Bing / Windows Update
  - domain_suffix: { match: bing.com, policy: Bing }
  - domain_suffix: { match: bing.net, policy: Bing }
  - domain_suffix: { match: bingapis.com, policy: Bing }
  - domain_keyword: { match: windowsupdate, policy: DIRECT }
  - domain_suffix: { match: update.microsoft.com, policy: DIRECT }
  - domain_suffix: { match: delivery.mp.microsoft.com, policy: DIRECT }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list, policy: Microsoft, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Bing/Bing.list, policy: Bing, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list, policy: GitHub, update_interval: 604800 }

  # 8. Cloudflare Pages & Workers
  - domain_suffix: { match: workers.dev, policy: Cloudflare }
  - domain_suffix: { match: pages.dev, policy: Cloudflare }

  # 9. 视频/音乐流媒体 / 社交平台
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTubeMusic/YouTubeMusic.list, policy: YouTubeMusic, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list, policy: YouTube, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Disney/Disney.list, policy: Disney, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/HBO/HBO.list, policy: HBO, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Netflix/Netflix.list, policy: Netflix, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list, policy: Spotify, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TikTok/TikTok.list, policy: TikTok, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/PayPal/PayPal.list, policy: PayPal, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list, policy: Telegram, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list, policy: Twitter, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list, policy: WeChat, update_interval: 604800 }
  - rule_set: { match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Instagram/Instagram.list, policy: Instagram, update_interval: 604800 }

  # 10. 国内规则与高性能 GeoIP 匹配前置
  - geoip: { match: CN, policy: DIRECT, no_resolve: true }
  - rule_set: { match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt, policy: DIRECT, update_interval: 604800 }

  # 11. 终极兜底策略
  - default: { policy: Proxy }

