    - domain_suffix: { match: amemv.com, value: ByteDNS }
    - domain_suffix: { match: toutiao.com, value: ByteDNS }
    - domain_suffix: { match: ixigua.com, value: ByteDNS }
    - domain_suffix: { match: mzstatic.com, value: AliDNS }
    - domain_suffix: { match: itunes.apple.com, value: AliDNS }
    - domain_suffix: { match: apps.apple.com, value: AliDNS }
