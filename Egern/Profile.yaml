    - domain_suffix: { match: cn, value: DNSPod }
    - domain_wildcard: { match: "*", value: Default }
  proxy_nameservers:
    - 223.5.5.5
    - 119.29.29.29

# ==================== 策略组 ====================
policy_groups:
  - auto_test: { name: 代理节点, urls: ["https://sub.store/download/collection/AllServer?target=Egern"], flatten: true, interval: 1800, tolerance: 100, timeout: 5, latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Global.png, hidden: true }
  - smart: { name: 香港节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇭🇰|香港|\\b(?:HK|HKG|Hong)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/HongKong.png }
  - smart: { name: 美国节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇺🇸|美国|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|纽约|迈阿密|休斯顿|亚特兰大|圣何塞|\\b(?:US|USA|United[\\s_-]*States|America)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/UnitedStates.png }
  - smart: { name: 台湾节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇹🇼|台湾|\\b(?:TW|TWN|Tai|Taiwan)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Taiwan.png }
  - smart: { name: 日本节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇯🇵|日本|东京|大阪|\\b(?:JP|JPN|Japan)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Japan.png }
  - smart: { name: 狮城节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇸🇬|新加坡|狮城|\\b(?:SG|SGP|Singapore)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Singapore.png }
  - smart: { name: 韩国节点, policies: [代理节点], flatten: true, filter: "(?i)(?:🇰🇷|韩国|首尔|仁川|\\b(?:KR|KOR|Korea)\\b)", latency_test_url: http://www.gstatic.com/generate_204, icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Korea.png }
  - select: { name: 其他节点, policies: [代理节点], flatten: true, filter: "(?i)^(?!.*(?:🇭🇰|香港|\\b(?:HK|HKG|Hong)\\b|🇺🇸|美国|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|纽约|迈阿密|休斯顿|亚特兰大|圣何塞|\\b(?:US|USA|United[\\s_-]*States|America)\\b|🇹🇼|台湾|\\b(?:TW|TWN|Tai|Taiwan)\\b|🇯🇵|日本|东京|大阪|\\b(?:JP|JPN|Japan)\\b|🇸🇬|新加坡|狮城|\\b(?:SG|SGP|Singapore)\\b|🇰🇷|韩国|首尔|仁川|\\b(?:KR|KOR|Korea)\\b)).*$", icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/WorldMap.png }
  - select: { name: Proxy, policies: [香港节点, 美国节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 其他节点], icon: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/image/Proxy.png }
